<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rejtvényfüzet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#E9EDF1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: home = scrolling booklet cover (rank, difficulty, topic cards). Game = fixed full-screen app: top bar, grid that fills the free space, clue bar, actions, built-in Hungarian keyboard on phones; clue columns on desktop. */
:root{
  --bg:#E9EDF1;
  --paper:#FFFFFF;
  --ink:#18202B;
  --muted:#5B6675;
  --line:#2A3442;
  --rule:#CDD5DE;
  --chip:#DCE2E9;
  --key:#FFFFFF;
  --key-2:#C9D1DB;
  --pencil:#F2C21B;
  --pencil-soft:#FBEDB4;
  --pencil-ink:#2E2400;
  --good:#1D7A45;
  --good-soft:#DDF1E4;
  --bad:#C0352B;
  --bad-soft:#FBE2DF;
  --shade:rgba(16,22,30,.45);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141A; --paper:#1A212B; --ink:#E7ECF2; --muted:#9AA6B5; --line:#7A8798; --rule:#2B3441; --chip:#242D39;
    --key:#2A333F; --key-2:#3A4452;
    --pencil:#E5B514; --pencil-soft:#3A3318; --pencil-ink:#1C1500;
    --good:#5BCB8A; --good-soft:#15301F; --bad:#FF7A6E; --bad-soft:#3A1C1A; --shade:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141A; --paper:#1A212B; --ink:#E7ECF2; --muted:#9AA6B5; --line:#7A8798; --rule:#2B3441; --chip:#242D39;
  --key:#2A333F; --key-2:#3A4452;
  --pencil:#E5B514; --pencil-soft:#3A3318; --pencil-ink:#1C1500;
  --good:#5BCB8A; --good-soft:#15301F; --bad:#FF7A6E; --bad-soft:#3A1C1A; --shade:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}

/* ---------- Home ---------- */
.home{max-width:980px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:grid;gap:26px}
.h-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 24px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,8vw,52px);letter-spacing:-.025em;line-height:1;margin:0}
.brand h1 span{background:linear-gradient(transparent 58%, var(--pencil) 58%, var(--pencil) 90%, transparent 90%);padding:0 2px}
.brand p{margin:8px 0 0;color:var(--muted);max-width:40ch}
.rank{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:14px;padding:12px 14px;min-width:min(100%,300px)}
.rank-badge{width:56px;height:56px;flex:none;display:grid;place-items:center;background:var(--ink);color:var(--paper);border-radius:12px;text-align:center;line-height:1}
.rank-badge small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.rank-badge b{font:800 26px/1 var(--f-display)}
.rank-info{flex:1;min-width:0;display:grid;gap:5px}
.rank-info strong{font:700 17px/1.1 var(--f-display)}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pencil);border-radius:99px;transition:width .4s}
.rank-info small{color:var(--muted);font-size:13px}

.block{display:grid;gap:12px}
.block h2{margin:0;font:800 13px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.cont{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--pencil);color:var(--pencil-ink);border:0;border-radius:14px;padding:14px 16px;cursor:pointer}
.cont .c-txt{flex:1;min-width:0;display:grid;gap:2px}
.cont .c-txt small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.8}
.cont b{font:800 19px/1.15 var(--f-display)}
.cont .arrow{font:800 26px/1 var(--f-display)}

.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.diff{display:grid;gap:3px;text-align:left;background:var(--paper);border:2px solid transparent;border-radius:12px;padding:12px;cursor:pointer}
.diff b{font:800 17px/1.1 var(--f-display)}
.diff span{font-size:13px;color:var(--muted)}
.diff[aria-pressed="true"]{border-color:var(--ink)}
.diff[aria-pressed="true"] b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pencil);margin-left:7px;vertical-align:middle}
@media (max-width:420px){.diff{padding:10px}.diff span{font-size:12px}}

.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.topic{display:flex;gap:12px;align-items:center;text-align:left;background:var(--paper);border:0;border-radius:14px;padding:12px;cursor:pointer;transition:transform .12s}
.topic:hover{transform:translateY(-1px)}
.topic:active{transform:scale(.99)}
.mono{width:52px;height:52px;flex:none;display:grid;place-items:center;border:2px solid var(--line);border-radius:4px;font:800 28px/1 var(--f-display);position:relative;background:var(--paper)}
.topic.played .mono{background:var(--pencil-soft)}
.t-txt{display:grid;gap:2px;min-width:0}
.t-txt b{font:700 17px/1.2 var(--f-display)}
.t-txt > span{font-size:13px;color:var(--muted)}
.t-stars{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:2px}
.stars{letter-spacing:1px;font-size:15px;color:var(--rule)}
.stars .on{color:var(--pencil)}

.settings{display:grid;gap:10px}
.set-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border-radius:12px;padding:12px 14px}
.seg{display:inline-flex;background:var(--chip);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;background:var(--chip);border-radius:99px;transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + span{background:var(--good)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:3px solid var(--pencil);outline-offset:2px}
.set-row label{flex:1;min-width:0}
.set-row small{display:block;color:var(--muted);font-size:13px}

/* ---------- Game ---------- */
.game{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);touch-action:manipulation;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.g-top{flex:none;display:flex;align-items:center;gap:8px;padding-block:4px 4px;padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px))}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;background:transparent;border-radius:10px;cursor:pointer;font:800 24px/1 var(--f-display)}
.icon-btn:hover{background:var(--chip)}
.icon-btn svg{width:22px;height:22px}
.g-title{flex:1;min-width:0;display:grid;line-height:1.15}
.g-title b{font:800 17px/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-title span{font-size:12px;color:var(--muted)}
.g-clock{font:700 18px/1 var(--f-display);font-variant-numeric:tabular-nums;padding:0 4px}
.g-progress{height:3px;background:var(--chip);margin-left:max(10px, env(safe-area-inset-left, 0px));margin-right:max(10px, env(safe-area-inset-right, 0px));border-radius:99px;overflow:hidden}
.g-progress i{display:block;height:100%;width:0;background:var(--pencil);transition:width .25s}
.g-body{flex:1;min-height:0;display:flex;padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px))}
.g-main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.g-gridarea{flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;padding:8px;position:relative}
.grid{display:grid;grid-template-columns:repeat(var(--cols), var(--cell, 32px));grid-auto-rows:var(--cell, 32px);gap:1px;padding:1px}
.cell{position:relative;background:var(--paper);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;cursor:pointer}
.cell.void{background:transparent;box-shadow:none;cursor:default}
.cell .num{position:absolute;top:1px;left:2px;font:700 max(8px, calc(var(--cell) * .26))/1 var(--f-body);color:var(--muted);pointer-events:none}
.cell .ch{font:700 calc(var(--cell) * .56)/1 var(--f-display);padding-top:calc(var(--cell) * .1);pointer-events:none}
.cell.inword{background:var(--pencil-soft)}
.cell.cur{background:var(--pencil)}
.cell.cur .ch,.cell.cur .num{color:var(--pencil-ink)}
.cell.ok .ch{color:var(--good)}
.cell.bad{background:var(--bad-soft)}
.cell.bad .ch{color:var(--bad)}
.cell.bad.cur{background:var(--pencil)}
.cell.rev::after{content:"";position:absolute;right:0;bottom:0;border-style:solid;border-width:0 0 calc(var(--cell) * .26) calc(var(--cell) * .26);border-color:transparent transparent var(--muted) transparent}
.game.done .cell{cursor:default}
.toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:nowrap;justify-content:center;background:var(--paper);border-radius:99px;padding:6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.18);max-width:calc(100% - 20px)}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.em{background:var(--chip);color:var(--muted)}

.cluebar{flex:none;display:flex;align-items:stretch;gap:4px;margin-inline:10px;background:var(--pencil-soft);border-radius:12px;min-height:52px}
.cluebar .nav{width:40px;flex:none;border:0;background:transparent;font:800 24px/1 var(--f-display);cursor:pointer;border-radius:12px}
.cluebar .nav:active{background:var(--pencil)}
.cb-mid{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:7px 2px;cursor:pointer;display:grid;align-content:center;gap:1px}
.cb-tag{font:800 12px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cb-txt{font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-actions{flex:none;display:flex;gap:6px;padding:6px 10px}
.g-actions button{flex:1 1 0;min-width:0;border:1.5px solid var(--rule);background:var(--paper);border-radius:10px;padding:7px 6px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.g-actions button.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.g-actions button:active{transform:scale(.97)}

.kbd{flex:none;display:grid;gap:6px;padding:6px max(4px, env(safe-area-inset-right, 0px)) 8px max(4px, env(safe-area-inset-left, 0px));background:var(--chip)}
.kbd .row{display:flex;justify-content:center;gap:5px}
.key{flex:1 1 0;max-width:calc(10% - 4.5px);height:42px;border:0;border-radius:7px;background:var(--key);box-shadow:0 1px 0 var(--key-2);font:600 20px/1 var(--f-display);cursor:pointer;padding:0;touch-action:manipulation}
.key.acc{background:var(--pencil-soft)}
.key.wide{max-width:none;flex:1.6 1 0;background:var(--key-2);font-size:18px}
.key.down{background:var(--pencil);color:var(--pencil-ink)}
.desk-hint{margin:0;padding:0 12px 12px;color:var(--muted);font-size:13px}
.desk-hint kbd{font:700 12px var(--f-body);background:var(--chip);border-radius:4px;padding:1px 5px}

.g-clues{width:360px;flex:none;overflow:auto;padding:10px 14px 20px 4px;display:grid;gap:14px;align-content:start}
.g-clues section,.sheet .clue-sec{background:var(--paper);border-radius:14px;padding:12px 6px 8px}
.g-clues h2,.sheet h3{font:800 12px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 8px 8px}
.clue-list{list-style:none;margin:0;padding:0}
.clue-list li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:4px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:15px}
.clue-list li:hover{background:var(--chip)}
.clue-list li.active{background:var(--pencil-soft)}
.clue-list li.full .c{color:var(--muted)}
.clue-list li b{font:800 15px/1.4 var(--f-display);font-variant-numeric:tabular-nums}
.clue-list .n{color:var(--muted);font-size:12px;white-space:nowrap}

body[data-layout="mobile"] .g-clues,body[data-layout="mobile"] .desk-hint{display:none}
body[data-layout="desk"] .kbd,body[data-layout="desk"] #a-list{display:none}
body[data-layout="desk"] .g-main{max-width:none}
body[data-layout="desk"] .g-actions{padding-bottom:8px}

/* ---------- Sheets ---------- */
.overlay{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:grid;gap:12px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0;font:800 24px/1.15 var(--f-display);text-wrap:balance}
.sheet p{margin:0;color:var(--muted)}
.sheet .btns{display:grid;gap:8px}
.btn{border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:13px 14px;font-weight:700;font-size:16px;cursor:pointer;text-align:center}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.warn{color:var(--bad)}
.menu-row{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:12px;padding:12px 14px}
.menu-row label{flex:1}
.win-stars{display:flex;gap:6px;font-size:44px;line-height:1;color:var(--rule)}
.win-stars span.on{color:var(--pencil)}
.win-rank{background:var(--paper);border-radius:12px;padding:10px 12px;color:var(--ink)!important;font-weight:700}
.sheet .clue-sec{background:var(--paper)}
@media (prefers-reduced-motion:no-preference){
  .cell.pop .ch{animation:pop .16s ease-out}
  @keyframes pop{from{transform:scale(1.35)}to{transform:none}}
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .win-stars span.on{animation:star .45s ease-out backwards}
  .win-stars span.on:nth-child(2){animation-delay:.12s}
  .win-stars span.on:nth-child(3){animation-delay:.24s}
  @keyframes star{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
}
</style>

<div class="home" id="home">
  <header class="h-top">
    <div class="brand">
      <h1><span>Rejtvényfüzet</span></h1>
      <p>Magyar keresztrejtvények hét témában. Minden játékban új rácsot rakunk össze.</p>
    </div>
    <div class="rank">
      <div class="rank-badge"><div><small>Szint</small><b id="rank-lvl">1</b></div></div>
      <div class="rank-info">
        <strong id="rank-name">Kezdő</strong>
        <div class="bar"><i id="rank-bar"></i></div>
        <small id="rank-next"></small>
      </div>
    </div>
  </header>

  <button type="button" class="cont" id="continue" hidden></button>

  <section class="block">
    <h2>Nehézség</h2>
    <div class="diffs" id="diffs"></div>
  </section>

  <section class="block">
    <h2>Válassz témát</h2>
    <div class="topics" id="topics"></div>
  </section>

  <section class="block settings">
    <h2>Beállítások</h2>
    <div class="set-row">
      <label for="pref-lenient">Ékezet nélkül is elfogadja<small>Például O is jó az Ő helyén.</small></label>
      <span class="switch"><input type="checkbox" id="pref-lenient"><span></span></span>
    </div>
    <div class="set-row">
      <span>Megjelenés</span>
      <div class="seg" id="theme-seg" role="group" aria-label="Megjelenés">
        <button type="button" data-v="system">Automatikus</button>
        <button type="button" data-v="light">Világos</button>
        <button type="button" data-v="dark">Sötét</button>
      </div>
    </div>
  </section>
</div>

<div class="game" id="game" hidden>
  <div class="g-top">
    <button type="button" class="icon-btn" id="g-back" aria-label="Vissza a menübe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="g-title"><b id="g-topic"></b><span id="g-level"></span></div>
    <div class="g-clock" id="g-clock">0:00</div>
    <button type="button" class="icon-btn" id="g-more" aria-label="További lehetőségek"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div class="g-progress"><i id="g-prog"></i></div>
  <div class="g-body">
    <div class="g-main">
      <div class="g-gridarea" id="gridarea">
        <div class="grid" id="grid" aria-hidden="true"></div>
        <div class="toast" id="toast" hidden></div>
      </div>
      <div class="cluebar">
        <button type="button" class="nav" id="cb-prev" aria-label="Előző meghatározás">‹</button>
        <button type="button" class="cb-mid" id="cb-mid" aria-live="polite"><span class="cb-tag" id="cb-tag"></span><span class="cb-txt" id="cb-txt"></span></button>
        <button type="button" class="nav" id="cb-next" aria-label="Következő meghatározás">›</button>
      </div>
      <div class="g-actions">
        <button type="button" class="primary" id="a-check">Ellenőrzés</button>
        <button type="button" id="a-letter">Betű</button>
        <button type="button" id="a-word">Szó</button>
        <button type="button" id="a-list">Lista</button>
      </div>
      <p class="desk-hint">Gépelj a billentyűzeten. <kbd>Szóköz</kbd> vagy újabb kattintás: irányváltás · <kbd>Enter</kbd>: következő szó · nyilak: mozgás.</p>
      <div class="kbd" id="kbd"></div>
    </div>
    <aside class="g-clues">
      <section><h2>Vízszintes</h2><ol class="clue-list" id="list-a"></ol></section>
      <section><h2>Függőleges</h2><ol class="clue-list" id="list-d"></ol></section>
    </aside>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script id="engine">
const TOPICS=[
  {id:"vegyes",name:"Vegyes",desc:"Minden témából egy kicsit"},
  {id:"tort",name:"Történelem",desc:"Királyok, csaták, korszakok"},
  {id:"geo",name:"Földrajz",desc:"Országok, városok, folyók, hegyek"},
  {id:"tud",name:"Tudomány",desc:"Elemek, bolygók, feltalálók"},
  {id:"muv",name:"Irodalom és művészet",desc:"Költők, festők, zeneszerzők"},
  {id:"ter",name:"Természet",desc:"Állatok és növények"},
  {id:"kony",name:"Konyha és otthon",desc:"Ételek, italok, háztartás"}
];
const LEVELS={
  1:{name:"Könnyű",size:9,target:8,msize:9,mtarget:8,note:"Hétköznapi szavak"},

2|KÜRTŐSKALÁCS|Fahengeren sütött, cukros édesség

3|ESZTERHÁZY|Diós-krémes torta egy hercegi család nevével
3|RIGÓJANCSI|Csokoládés kockatorta egy cigányprímás nevével
3|SOMLÓI|… galuska
3|ZSERBÓ|Diós-lekváros, csokoládés tetejű szelet
3|FLÓDNI|Négyrétegű zsidó sütemény
3|TÖPÖRTYŰ|Kisütött szalonnadarabka
3|KOCSONYA|Remegő, hidegen tálalt húsétel
3|HURKA|Májas vagy véres töltelékáru
3|TARHONYA|Apró szemű, pirított tészta
3|MANGALICA|Göndör szőrű magyar sertésfajta
3|UNICUM|A Zwack család gyógynövénylikőrje
3|BIKAVÉR|Egri és szekszárdi vörösbor
3|ASZÚ|Tokaji édes bor
3|KADARKA|Vörösbor-szőlőfajta
3|DERELYE|Lekváros tésztatáska
3|KRÉMES|Vaníliakrémes sütemény
3|SÓLET|Babos zsidó étel, főtt tojással
3|LIBAMÁJ|Ludak drága csemegéje
3|PACAL|Marhapörköltként is főzött belsőség
3|MÁKOSGUBA|Kiflis-mákos karácsonyi édesség`
};
function parseTopic(id){return DATA[id].split("\n").map(l=>{const [d,w,c]=l.split("|");return {d:+d,word:w.trim(),clue:c.trim(),topic:id};});}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pools(topic,lvl,max){
  const ids=topic==="vegyes"?TOPICS.filter(t=>t.id!=="vegyes").map(t=>t.id):[topic];
  const seen=new Set(),all=[];
  ids.forEach(id=>parseTopic(id).forEach(w=>{if(!seen.has(w.word)){seen.add(w.word);all.push(w);}}));
  const ok=all.filter(w=>{const n=Array.from(w.word).length;return n>=3&&n<=max;});
  return {primary:ok.filter(w=>w.d===lvl),secondary:ok.filter(w=>Math.abs(w.d-lvl)===1)};
}
function buildOnce(primary,secondary,size,target){
  const cells=new Map(),placed=[];let b=null,crossings=0,extra=0;
  const key=(r,c)=>r+","+c,get=(r,c)=>cells.get(key(r,c));
  function fits(L,r,c,dir){
    const dr=dir==="d"?1:0,dc=dir==="a"?1:0,n=L.length;
    if(get(r-dr,c-dc)||get(r+dr*n,c+dc*n))return -1;
    let x=0;
    for(let i=0;i<n;i++){
      const rr=r+dr*i,cc=c+dc*i,ex=get(rr,cc);
      if(ex){if(ex.ch!==L[i]||ex[dir])return -1;x++;}
      else if(get(rr+dc,cc+dr)||get(rr-dc,cc-dr))return -1;
    }
    if(b){
      const minR=Math.min(b.minR,r),maxR=Math.max(b.maxR,r+dr*(n-1)),minC=Math.min(b.minC,c),maxC=Math.max(b.maxC,c+dc*(n-1));
      if(maxR-minR+1>size||maxC-minC+1>size)return -1;
    }
    return x;
  }
  function put(item,L,r,c,dir){
    const dr=dir==="d"?1:0,dc=dir==="a"?1:0;
    L.forEach((ch,i)=>{const k=key(r+dr*i,c+dc*i);const ex=cells.get(k)||{ch,a:false,d:false};ex[dir]=true;cells.set(k,ex);});
    const er=r+dr*(L.length-1),ec=c+dc*(L.length-1);
    b=b?{minR:Math.min(b.minR,r),maxR:Math.max(b.maxR,er),minC:Math.min(b.minC,c),maxC:Math.max(b.maxC,ec)}:{minR:r,maxR:er,minC:c,maxC:ec};
    placed.push({word:item.word,clue:item.clue,letters:L,r,c,dir});
  }
  const prim=shuffle(primary).slice(0,70),sec=shuffle(secondary).slice(0,30);
  const head=prim.slice(0,12).sort((x,y)=>Array.from(y.word).length-Array.from(x.word).length)[0];
  put(head,Array.from(head.word),0,0,Math.random()<.5?"a":"d");
  const order=prim.filter(w=>w!==head).concat(sec);
  for(let pass=0;pass<2&&placed.length<target;pass++){
    for(const item of order){
      if(placed.length>=target)break;
      if(placed.some(p=>p.word===item.word))continue;
      const L=Array.from(item.word);let best=[],bx=0;
      for(const [k,cell] of cells){
        const [r,c]=k.split(",").map(Number);
        for(let i=0;i<L.length;i++){
          if(L[i]!==cell.ch)continue;
          for(const dir of ["a","d"]){
            if(cell[dir])continue;
            const sr=dir==="d"?r-i:r,sc=dir==="a"?c-i:c,x=fits(L,sr,sc,dir);
            if(x<1)continue;
            if(x>bx){bx=x;best=[[sr,sc,dir]];}else if(x===bx)best.push([sr,sc,dir]);
          }
        }
      }
      if(best.length){const [r,c,dir]=best[Math.floor(Math.random()*best.length)];put(item,L,r,c,dir);crossings+=bx;if(item.d!==head.d&&!primary.includes(item))extra++;}
    }
  }
  const w=b.maxC-b.minC+1,h=b.maxR-b.minR+1;
  placed.forEach(p=>{p.r-=b.minR;p.c-=b.minC;});
  return {w,h,words:placed,score:placed.length*100+crossings*12-w*h*.4+Math.min(w,h)*3-extra*25};
}
function generate(topic,lvl,compact){
  const cfg=levelCfg(lvl,compact),{primary,secondary}=pools(topic,lvl,cfg.size);
  let best=null;
  for(let t=0;t<40;t++){const g=buildOnce(primary,secondary,cfg.size,cfg.target);if(!best||g.score>best.score)best=g;}
  const starts=new Map();
  best.words.forEach(wd=>{const k=wd.r*1000+wd.c;if(!starts.has(k))starts.set(k,[]);starts.get(k).push(wd);});
  let n=1;
  [...starts.keys()].sort((a,b)=>a-b).forEach(k=>{starts.get(k).forEach(wd=>wd.num=n);n++;});
  best.words.sort((a,b)=>a.num-b.num||(a.dir<b.dir?-1:1));
  return {w:best.w,h:best.h,words:best.words.map(({word,clue,letters,r,c,dir,num})=>({word,clue,letters,r,c,dir,num}))};
}
if(typeof module!=="undefined")module.exports={generate,pools,levelCfg,LEVELS,TOPICS};
</script>

<script>
(function(){
const $=id=>document.getElementById(id);
const NS="rf2:";
const store={
  get(k,d){try{const v=localStorage.getItem(NS+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem(NS+k);}catch(e){}}
};
const prefs=Object.assign({lenient:false,theme:"system",lvl:1},store.get("prefs",{}));
const savePrefs=()=>store.set("prefs",prefs);
let stats=Object.assign({stars:0,solved:0,by:{}},store.get("stats",{}));
const FOLD={"Á":"A","É":"E","Í":"I","Ó":"O","Ö":"O","Ő":"O","Ú":"U","Ü":"U","Ű":"U"};
const fold=ch=>FOLD[ch]||ch;
const RANKS=[[0,"Kezdő"],[3,"Ceruzaforgató"],[8,"Kockatöltő"],[15,"Szóvadász"],[25,"Betűmester"],[40,"Rejtvényfejtő"],[60,"Rejtvénymester"],[85,"Nagymester"],[120,"Legenda"]];
const rankOf=s=>{let i=0;while(i+1<RANKS.length&&s>=RANKS[i+1][0])i++;return i;};
const topicName=id=>(TOPICS.find(t=>t.id===id)||{}).name||"";
const fmt=ms=>{const s=Math.floor(ms/1000),m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0");};
const starsHtml=n=>`<span class="stars" aria-label="${n} csillag">${[0,1,2].map(i=>`<span class="${i<n?"on":""}">★</span>`).join("")}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

let G=null,cur=null,cellEls=null,screen="home",sheetKind=null,toastT=null;

/* ---------- theme & layout ---------- */
function applyTheme(user){
  if(prefs.theme==="system"){if(user)document.documentElement.removeAttribute("data-theme");}
  else document.documentElement.setAttribute("data-theme",prefs.theme);
}
function setLayout(){
  const coarse=window.matchMedia("(pointer: coarse)").matches;
  const lay=(coarse||window.innerWidth<900)?"mobile":"desk";
  if(document.body.dataset.layout!==lay){document.body.dataset.layout=lay;if(screen==="home")renderHome();}
  sizeGrid();
}

/* ---------- home ---------- */
function renderHome(){
  const s=stats.stars,ri=rankOf(s);
  $("rank-lvl").textContent=ri+1;
  $("rank-name").textContent=RANKS[ri][1];
  if(ri+1<RANKS.length){
    const a=RANKS[ri][0],b=RANKS[ri+1][0];
    $("rank-bar").style.width=Math.round((s-a)/(b-a)*100)+"%";
    $("rank-next").textContent=`${s} csillag · még ${b-s} a következő szintig`;
  }else{$("rank-bar").style.width="100%";$("rank-next").textContent=`${s} csillag · elérted a legmagasabb szintet`;}

  const saved=store.get("game",null),cont=$("continue");
  if(saved&&!saved.done&&saved.P){
    const tot=countCells(saved.P),fill=countFilled(saved);
    cont.innerHTML=`<span class="c-txt"><small>Folytatás</small><b>${esc(topicName(saved.topic))} · ${LEVELS[saved.lvl].name}</b><span>${Math.round(fill/tot*100)}% kitöltve · ${fmt(saved.ms||0)}</span></span><span class="arrow">›</span>`;
    cont.hidden=false;cont.onclick=()=>openGame(saved);
  }else cont.hidden=true;

  const d=$("diffs");d.innerHTML="";
  [1,2,3].forEach(lv=>{
    const L=LEVELS[lv],b=document.createElement("button");
    b.type="button";b.className="diff";b.setAttribute("aria-pressed",prefs.lvl===lv);
    const C=levelCfg(lv,document.body.dataset.layout==="mobile");
    b.innerHTML=`<b>${L.name}</b><span>${C.size}×${C.size}, ${C.target} szó</span><span>${L.note}</span>`;
    b.onclick=()=>{prefs.lvl=lv;savePrefs();renderHome();};
    d.appendChild(b);
  });

  const t=$("topics");t.innerHTML="";
  TOPICS.forEach(tp=>{
    const st=stats.by[tp.id+"|"+prefs.lvl]||{solved:0,best:0},b=document.createElement("button");
    b.type="button";b.className="topic"+(st.solved?" played":"");
    b.innerHTML=`<span class="mono" aria-hidden="true">${esc(tp.name[0])}</span><span class="t-txt"><b>${esc(tp.name)}</b><span>${esc(tp.desc)}</span><span class="t-stars">${starsHtml(st.best)}<em>${st.solved?st.solved+" megfejtve":"Még nem játszottad"}</em></span></span>`;
    b.onclick=()=>startTopic(tp.id,prefs.lvl);
    t.appendChild(b);
  });

  $("pref-lenient").checked=prefs.lenient;
  document.querySelectorAll("#theme-seg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===prefs.theme));
}
function countCells(P){const s=new Set();P.words.forEach(w=>w.letters.forEach((_,i)=>s.add((w.r+(w.dir==="d"?i:0))+","+(w.c+(w.dir==="a"?i:0)))));return s.size;}
function countFilled(g){let n=0;g.entries.forEach(row=>row.forEach(v=>{if(v)n++;}));return n;}

function startTopic(topic,lvl){
  const saved=store.get("game",null);
  if(saved&&!saved.done&&saved.P){
    if(saved.topic===topic&&saved.lvl===lvl){openGame(saved);return;}
    if(countFilled(saved)>0){
      confirmSheet("Félbehagyott rejtvényed van",`A ${topicName(saved.topic)} · ${LEVELS[saved.lvl].name} rejtvényed elvész, ha újat kezdesz.`,"Új rejtvény",()=>newGame(topic,lvl));
      return;
    }
  }
  newGame(topic,lvl);
}
function newGame(topic,lvl){
  const P=generate(topic,lvl,document.body.dataset.layout==="mobile");
  const g={topic,lvl,P,entries:Array.from({length:P.h},()=>Array(P.w).fill("")),rev:{},marks:{},ms:0,done:false,gaveUp:false,hints:0};
  store.set("game",g);
  openGame(g);
}

/* ---------- game ---------- */
function openGame(g){
  G=g;
  G.sol=Array.from({length:G.P.h},()=>Array(G.P.w).fill(null));
  G.P.words.forEach(w=>w.letters.forEach((ch,i)=>{G.sol[w.r+(w.dir==="d"?i:0)][w.c+(w.dir==="a"?i:0)]=ch;}));
  screen="game";
  $("home").hidden=true;$("game").hidden=false;
  $("g-topic").textContent=topicName(G.topic);
  $("g-level").textContent=`${LEVELS[G.lvl].name} · ${G.P.words.length} szó`;
  $("game").classList.toggle("done",!!G.done);
  renderGrid();renderClues();
  const first=G.P.words[0];select(first.r,first.c,first.dir);
  updateProgress();setLayout();tickClock();
  window.scrollTo(0,0);
}
function backHome(){
  saveGame();closeSheet();
  screen="home";$("game").hidden=true;$("home").hidden=false;
  renderHome();window.scrollTo(0,0);
}
function saveGame(){
  if(!G)return;
  if(G.done){store.del("game");return;}
  const {sol,...rest}=G;
  store.set("game",rest);
}

function renderGrid(){
  const g=$("grid");g.innerHTML="";g.style.setProperty("--cols",G.P.w);
  cellEls=Array.from({length:G.P.h},()=>Array(G.P.w).fill(null));
  const nums={};G.P.words.forEach(w=>nums[w.r+","+w.c]=w.num);
  for(let r=0;r<G.P.h;r++)for(let c=0;c<G.P.w;c++){
    const d=document.createElement("div");
    if(!G.sol[r][c]){d.className="cell void";g.appendChild(d);continue;}
    d.className="cell";
    if(nums[r+","+c])d.insertAdjacentHTML("beforeend",`<span class="num">${nums[r+","+c]}</span>`);
    const ch=document.createElement("span");ch.className="ch";ch.textContent=G.entries[r][c];d.appendChild(ch);
    d.addEventListener("click",()=>{if(cur&&cur.r===r&&cur.c===c)toggleDir();else select(r,c,cur?cur.dir:"a");});
    g.appendChild(d);cellEls[r][c]=d;
  }
  paintMarks();
}
function renderClues(){
  ["a","d"].forEach(dir=>{
    const ol=$("list-"+dir);ol.innerHTML="";
    G.P.words.filter(w=>w.dir===dir).forEach(w=>{
      const li=document.createElement("li");
      li.innerHTML=`<b>${w.num}.</b><span class="c">${esc(w.clue)} <span class="n">(${w.letters.length})</span></span>`;
      li.onclick=()=>select(w.r,w.c,dir);
      ol.appendChild(li);w._li=li;
    });
  });
  markFull();
}
function sizeGrid(){
  if(screen!=="game"||!G)return;
  const a=$("gridarea"),W=a.clientWidth-16,H=a.clientHeight-16;
  const cell=Math.max(14,Math.floor(Math.min((W-2)/G.P.w-1,(H-2)/G.P.h-1,52)));
  $("grid").style.setProperty("--cell",cell+"px");
}

const wordAt=(r,c,dir)=>G.P.words.find(w=>w.dir===dir&&(dir==="a"?(w.r===r&&c>=w.c&&c<w.c+w.letters.length):(w.c===c&&r>=w.r&&r<w.r+w.letters.length)));
const cellsOf=w=>w.letters.map((_,i)=>[w.r+(w.dir==="d"?i:0),w.c+(w.dir==="a"?i:0)]);
const allCells=()=>{const o=[];for(let r=0;r<G.P.h;r++)for(let c=0;c<G.P.w;c++)if(G.sol[r][c])o.push([r,c]);return o;};

function select(r,c,dir){
  if(!wordAt(r,c,dir))dir=dir==="a"?"d":"a";
  cur={r,c,dir};highlight();
}
function toggleDir(){const nd=cur.dir==="a"?"d":"a";if(wordAt(cur.r,cur.c,nd)){cur.dir=nd;highlight();}}
function highlight(){
  document.querySelectorAll(".cell.inword,.cell.cur").forEach(e=>e.classList.remove("inword","cur"));
  document.querySelectorAll(".clue-list li.active").forEach(e=>e.classList.remove("active"));
  const w=wordAt(cur.r,cur.c,cur.dir);
  if(w){
    cellsOf(w).forEach(([r,c])=>cellEls[r][c].classList.add("inword"));
    if(w._li){w._li.classList.add("active");if(document.body.dataset.layout==="desk")w._li.scrollIntoView({block:"nearest"});}
    $("cb-tag").textContent=`${w.num}. ${w.dir==="a"?"vízszintes":"függőleges"} · ${w.letters.length} betű`;
    $("cb-txt").textContent=w.clue;
  }
  cellEls[cur.r][cur.c].classList.add("cur");
}
function setCell(r,c,v,pop){
  G.entries[r][c]=v;
  const el=cellEls[r][c];el.querySelector(".ch").textContent=v;
  delete G.marks[r+","+c];el.classList.remove("ok","bad");
  if(pop&&v){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");}
}
function moveInWord(back){
  const w=wordAt(cur.r,cur.c,cur.dir);if(!w)return false;
  const cs=cellsOf(w),i=cs.findIndex(([r,c])=>r===cur.r&&c===cur.c),ni=i+(back?-1:1);
  if(ni<0||ni>=cs.length)return false;
  select(cs[ni][0],cs[ni][1],cur.dir);return true;
}
function wordOrder(){return [...G.P.words.filter(w=>w.dir==="a"),...G.P.words.filter(w=>w.dir==="d")];}
function nextWord(back,preferEmpty){
  const order=wordOrder(),w=wordAt(cur.r,cur.c,cur.dir);
  let i=order.indexOf(w);
  for(let k=1;k<=order.length;k++){
    const nw=order[(i+(back?-k:k)+order.length*2)%order.length];
    const empty=cellsOf(nw).find(([r,c])=>!G.entries[r][c]);
    if(!preferEmpty||empty||k===order.length){const [r,c]=empty||[nw.r,nw.c];select(r,c,nw.dir);return;}
  }
}
function typeLetter(ch){
  if(!G||G.done)return;
  const k=cur.r+","+cur.c;
  if(!G.rev[k])setCell(cur.r,cur.c,ch,true);
  if(!moveInWord(false)){
    const w=wordAt(cur.r,cur.c,cur.dir);
    if(!w||cellsOf(w).every(([r,c])=>G.entries[r][c]))nextWord(false,true);
  }else{
    // skip over revealed letters
    let guard=0;while(G.rev[cur.r+","+cur.c]&&guard++<20&&moveInWord(false));
  }
  afterChange();
}
function backspace(){
  if(!G||G.done)return;
  const k=cur.r+","+cur.c;
  if(G.entries[cur.r][cur.c]&&!G.rev[k]){setCell(cur.r,cur.c,"");}
  else if(moveInWord(true)){if(!G.rev[cur.r+","+cur.c])setCell(cur.r,cur.c,"");}
  afterChange();
}
function step(dr,dc){
  let r=cur.r+dr,c=cur.c+dc;
  while(r>=0&&r<G.P.h&&c>=0&&c<G.P.w){if(G.sol[r][c]){select(r,c,cur.dir);return;}r+=dr;c+=dc;}
}
const matches=(r,c)=>{const v=G.entries[r][c],s=G.sol[r][c];return !!v&&(v===s||(prefs.lenient&&fold(v)===fold(s)));};
function afterChange(){
  updateProgress();markFull();
  if(!G.done&&allCells().every(([r,c])=>matches(r,c))){finish(false);return;}
  saveGame();
}
function updateProgress(){const cs=allCells();$("g-prog").style.width=Math.round(cs.filter(([r,c])=>G.entries[r][c]).length/cs.length*100)+"%";}
function markFull(){G.P.words.forEach(w=>w._li&&w._li.classList.toggle("full",cellsOf(w).every(([r,c])=>G.entries[r][c])));}
function paintMarks(){
  allCells().forEach(([r,c])=>{const k=r+","+c,cl=cellEls[r][c].classList,m=G.marks[k];cl.toggle("ok",m==="ok");cl.toggle("bad",m==="bad");cl.toggle("rev",!!G.rev[k]);});
}
function check(){
  if(G.done)return;
  let ok=0,bad=0,em=0;
  allCells().forEach(([r,c])=>{
    const k=r+","+c;
    if(!G.entries[r][c]){em++;delete G.marks[k];}
    else if(matches(r,c)){ok++;G.marks[k]="ok";}
    else{bad++;G.marks[k]="bad";}
  });
  paintMarks();
  if(!bad&&!em){finish(false);return;}
  toast(`<span class="pill ok">${ok} jó</span><span class="pill no">${bad} hibás</span><span class="pill em">${em} üres</span>`);
  saveGame();
}
function toast(html){
  const t=$("toast");t.innerHTML=html;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3800);
}
function reveal(list){
  if(G.done)return;
  let n=0;
  list.forEach(([r,c])=>{if(G.entries[r][c]===G.sol[r][c])return;setCell(r,c,G.sol[r][c],true);G.rev[r+","+c]=true;n++;});
  G.hints+=n;paintMarks();afterChange();
}
function finish(gaveUp){
  G.done=true;G.gaveUp=gaveUp;
  $("game").classList.add("done");
  if(!gaveUp)allCells().forEach(([r,c])=>{G.marks[r+","+c]="ok";});
  paintMarks();
  const stars=gaveUp?0:G.hints===0?3:G.hints<=3?2:1;
  const before=rankOf(stats.stars);
  if(!gaveUp){
    const k=G.topic+"|"+G.lvl,st=stats.by[k]||{solved:0,best:0};
    st.solved++;st.best=Math.max(st.best,stars);stats.by[k]=st;
    stats.stars+=stars;stats.solved++;store.set("stats",stats);
  }
  store.del("game");
  const after=rankOf(stats.stars);
  setTimeout(()=>winSheet(stars,gaveUp,after>before?after:null),gaveUp?0:450);
}

/* ---------- sheets ---------- */
function openSheet(kind,html){
  sheetKind=kind;$("sheet").innerHTML=html;$("overlay").hidden=false;
  const f=$("sheet").querySelector("button");if(f&&document.body.dataset.layout==="desk")f.focus();
}
function closeSheet(){sheetKind=null;$("overlay").hidden=true;$("sheet").innerHTML="";}
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeSheet();});
function confirmSheet(title,text,yes,fn){
  openSheet("confirm",`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="btns"><button type="button" class="btn primary" id="s-yes">${esc(yes)}</button><button type="button" class="btn" id="s-no">Mégse</button></div>`);
  $("s-yes").onclick=()=>{closeSheet();fn();};$("s-no").onclick=closeSheet;
}
function menuSheet(){
  openSheet("menu",`<h2>${esc(topicName(G.topic))} · ${LEVELS[G.lvl].name}</h2>
  <div class="menu-row"><label for="m-len">Ékezet nélkül is elfogadja</label><span class="switch"><input type="checkbox" id="m-len" ${prefs.lenient?"checked":""}><span></span></span></div>
  <div class="btns">
    <button type="button" class="btn" id="m-new">Új rejtvény ebben a témában</button>
    <button type="button" class="btn warn" id="m-solve" ${G.done?"disabled":""}>Megoldás megmutatása</button>
    <button type="button" class="btn" id="m-home">Vissza a menübe</button>
    <button type="button" class="btn primary" id="m-close">Folytatom</button>
  </div>`);
  $("m-len").onchange=e=>{prefs.lenient=e.target.checked;savePrefs();if(!G.done)afterChange();};
  $("m-new").onclick=()=>{if(!G.done&&countFilled(G)>0)confirmSheet("Új rejtvényt kezdesz?","A mostani állás elvész.","Új rejtvény",()=>newGame(G.topic,G.lvl));else{closeSheet();newGame(G.topic,G.lvl);}};
  $("m-solve").onclick=()=>confirmSheet("Megnézed a megoldást?","Ezért a rejtvényért nem jár csillag.","Megoldás",()=>{allCells().forEach(([r,c])=>{if(!matches(r,c)){setCell(r,c,G.sol[r][c]);G.rev[r+","+c]=true;}});finish(true);});
  $("m-home").onclick=backHome;
  $("m-close").onclick=closeSheet;
}
function listSheet(){
  const sec=dir=>`<div class="clue-sec"><h3>${dir==="a"?"Vízszintes":"Függőleges"}</h3><ol class="clue-list">${G.P.words.filter(w=>w.dir===dir).map(w=>{const full=cellsOf(w).every(([r,c])=>G.entries[r][c]);const act=wordAt(cur.r,cur.c,cur.dir)===w;return `<li data-n="${w.num}" data-d="${dir}" class="${full?"full":""} ${act?"active":""}"><b>${w.num}.</b><span class="c">${esc(w.clue)} <span class="n">(${w.letters.length})</span></span></li>`;}).join("")}</ol></div>`;
  openSheet("list",`<h2>Meghatározások</h2>${sec("a")}${sec("d")}<button type="button" class="btn" id="l-close">Bezárás</button>`);
  $("sheet").querySelectorAll("li").forEach(li=>li.onclick=()=>{const w=G.P.words.find(x=>x.num===+li.dataset.n&&x.dir===li.dataset.d);closeSheet();select(w.r,w.c,w.dir);});
  $("l-close").onclick=closeSheet;
}
function winSheet(stars,gaveUp,newRank){
  const head=gaveUp
    ?`<h2>Itt a megoldás</h2><p>Nézd át nyugodtan a rácsot. Legközelebb biztosan megy!</p>`
    :`<div class="win-stars" aria-label="${stars} csillag">${[0,1,2].map(i=>`<span class="${i<stars?"on":""}">★</span>`).join("")}</div>
      <h2>Megfejtetted!</h2>
      <p>${fmt(G.ms)} alatt, ${G.hints?G.hints+" felfedett betűvel":"segítség nélkül"}.${stars<3?" Három csillag segítség nélkül jár.":""}</p>
      <p class="win-rank">${newRank!==null?`Szintet léptél! Szint ${newRank+1} · ${RANKS[newRank][1]}`:`+${stars} csillag · összesen ${stats.stars}`}</p>`;
  openSheet("win",`${head}<div class="btns"><button type="button" class="btn primary" id="w-next">Következő rejtvény</button><button type="button" class="btn" id="w-grid">Megnézem a rácsot</button><button type="button" class="btn" id="w-home">Vissza a menübe</button></div>`);
  $("w-next").onclick=()=>{closeSheet();newGame(G.topic,G.lvl);};
  $("w-grid").onclick=closeSheet;
  $("w-home").onclick=backHome;
}

/* ---------- on-screen keyboard ---------- */
const ROWS=[["Á","É","Í","Ó","Ö","Ő","Ú","Ü","Ű"],["Q","W","E","R","T","Z","U","I","O","P"],["A","S","D","F","G","H","J","K","L"],["Y","X","C","V","B","N","M","⌫"]];
(function buildKbd(){
  const k=$("kbd");
  ROWS.forEach((row,ri)=>{
    const d=document.createElement("div");d.className="row";
    row.forEach(ch=>{
      const b=document.createElement("button");b.type="button";
      b.className="key"+(ri===0?" acc":"")+(ch==="⌫"?" wide":"");
      b.textContent=ch;b.setAttribute("aria-label",ch==="⌫"?"Törlés":ch);
      const press=()=>{if(ch==="⌫")backspace();else typeLetter(ch);try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}};
      b.addEventListener("pointerdown",e=>{e.preventDefault();b.classList.add("down");press();});
      ["pointerup","pointerleave","pointercancel"].forEach(t=>b.addEventListener(t,()=>b.classList.remove("down")));
      b.addEventListener("click",e=>{if(e.detail===0)press();});
      d.appendChild(b);
    });
    k.appendChild(d);
  });
})();

/* ---------- physical keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(screen!=="game"||!G)return;
  if(sheetKind){if(e.key==="Escape")closeSheet();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k.length===1&&/\p{L}/u.test(k)){e.preventDefault();typeLetter(k.toLocaleUpperCase("hu"));return;}
  if(k==="Backspace"||k==="Delete"){e.preventDefault();backspace();}
  else if(k==="ArrowRight"||k==="ArrowLeft"){e.preventDefault();if(cur.dir!=="a"&&wordAt(cur.r,cur.c,"a")){cur.dir="a";highlight();}else step(0,k==="ArrowRight"?1:-1);}
  else if(k==="ArrowDown"||k==="ArrowUp"){e.preventDefault();if(cur.dir!=="d"&&wordAt(cur.r,cur.c,"d")){cur.dir="d";highlight();}else step(k==="ArrowDown"?1:-1,0);}
  else if(k===" "){e.preventDefault();toggleDir();}
  else if(k==="Enter"||k==="Tab"){e.preventDefault();nextWord(e.shiftKey,false);}
  else if(k==="Escape"){backHome();}
});

/* ---------- clock ---------- */
let last=Date.now(),tickN=0;
function tickClock(){if(G)$("g-clock").textContent=fmt(G.ms);}
setInterval(()=>{
  const n=Date.now(),dt=n-last;last=n;
  if(screen==="game"&&G&&!G.done&&!document.hidden){G.ms+=dt;tickClock();if(++tickN%5===0)saveGame();}
},1000);
document.addEventListener("visibilitychange",()=>{last=Date.now();if(document.hidden)saveGame();});
window.addEventListener("pagehide",saveGame);

/* ---------- wiring ---------- */
$("g-back").onclick=backHome;
$("g-more").onclick=menuSheet;
$("cb-prev").onclick=()=>nextWord(true,false);
$("cb-next").onclick=()=>nextWord(false,false);
$("cb-mid").onclick=toggleDir;
$("a-check").onclick=check;
$("a-letter").onclick=()=>reveal([[cur.r,cur.c]]);
$("a-word").onclick=()=>{const w=wordAt(cur.r,cur.c,cur.dir);if(w)reveal(cellsOf(w));};
$("a-list").onclick=listSheet;
$("pref-lenient").onchange=e=>{prefs.lenient=e.target.checked;savePrefs();};
document.querySelectorAll("#theme-seg button").forEach(b=>b.onclick=()=>{prefs.theme=b.dataset.v;savePrefs();applyTheme(true);renderHome();});
window.addEventListener("resize",setLayout);
if(window.ResizeObserver)new ResizeObserver(sizeGrid).observe($("gridarea"));

applyTheme(false);
setLayout();
renderHome();
})();
</script>
